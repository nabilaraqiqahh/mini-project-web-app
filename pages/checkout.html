<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - DysCover Nexus</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkout-container {
            margin: 4rem auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        .checkout-form {
            padding: 2rem;
        }
        .form-section {
            margin-bottom: 2.5rem;
        }
        .form-section h3 {
            margin-bottom: 1.5rem;
            color: var(--primary);
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }
        .payment-methods {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .payment-card {
            flex: 1;
            padding: 1rem;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .payment-card:hover, .payment-card.active {
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.1);
        }
        .payment-card i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        @media (max-width: 992px) {
            .checkout-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-gamepad"></i> <span>DYSCOVER</span> NEXUS
            </a>
            <nav class="nav-links">
                <a href="cart.html"><i class="fa-solid fa-arrow-left"></i> Back to Cart</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="checkout-container">
            <!-- Checkout Form -->
            <div class="glass-panel checkout-form">
                <form action="confirmation.html" method="GET">
                    <!-- Billing Info -->
                    <div class="form-section">
                        <h3>1. Billing Information</h3>
                        <div class="grid-2">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Email Address (For Digital Delivery)</label>
                            <input type="email" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label>City</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Zip / Postal Code</label>
                                <input type="text" class="form-control" required>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Info -->
                    <div class="form-section">
                        <h3>2. Payment Method</h3>
                        <div class="payment-methods">
                            <div class="payment-card active">
                                <i class="fa-brands fa-cc-visa"></i>
                                <div>Credit Card</div>
                            </div>
                            <div class="payment-card">
                                <i class="fa-brands fa-paypal"></i>
                                <div>PayPal</div>
                            </div>
                            <div class="payment-card">
                                <i class="fa-brands fa-bitcoin"></i>
                                <div>Crypto</div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Card Number</label>
                            <input type="text" class="form-control" placeholder="0000 0000 0000 0000" required>
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label>Expiry Date</label>
                                <input type="text" class="form-control" placeholder="MM/YY" required>
                            </div>
                            <div class="form-group">
                                <label>CVC</label>
                                <input type="text" class="form-control" placeholder="123" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.2rem; padding: 1rem;">Complete Purchase</button>
                </form>
            </div>

            <!-- Order Summary (Sidebar) -->
            <div class="glass-panel" style="padding: 2rem; height: fit-content;">
                <h3 style="margin-bottom: 2rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem;">Order Summary</h3>
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center;">
                    <img src="https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=2070&auto=format&fit=crop" style="width: 60px; border-radius: 4px;" alt="Core Edition">
                    <div>
                        <div style="font-weight: bold;">DysCover Nexus: Core</div>
                        <div style="color: var(--text-muted); font-size: 0.9rem;">Qty: 1</div>
                    </div>
                    <div style="margin-left: auto;">$29.99</div>
                </div>
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center;">
                    <img src="https://images.unsplash.com/photo-1614680376593-902f74cf0d41?q=80&w=1974&auto=format&fit=crop" style="width: 60px; border-radius: 4px;" alt="DLC">
                    <div>
                        <div style="font-weight: bold;">Algebraic Awakening</div>
                        <div style="color: var(--text-muted); font-size: 0.9rem;">Qty: 1</div>
                    </div>
                    <div style="margin-left: auto;">$14.99</div>
                </div>
                
                <div style="border-top: 1px solid var(--glass-border); padding-top: 1.5rem; margin-top: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--text-muted);">
                        <span>Subtotal</span>
                        <span>$44.98</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--text-muted);">
                        <span>Tax</span>
                        <span>$3.60</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 1rem; font-size: 1.2rem; font-weight: bold; color: var(--primary);">
                        <span>Total</span>
                        <span>$48.58</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Simple UI interaction for payment methods
        document.querySelectorAll('.payment-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.payment-card').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
