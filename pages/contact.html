<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - DysCover Nexus</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contact-container {
            max-width: 900px;
            margin: 4rem auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border-radius: 16px;
            overflow: hidden;
        }
        .contact-info {
            background: rgba(0, 210, 255, 0.1);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .contact-form-wrapper {
            padding: 3rem;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .info-item i {
            color: var(--primary);
            font-size: 1.5rem;
        }
        .map-placeholder {
            width: 100%;
            height: 200px;
            background: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=2070&auto=format&fit=crop') center/cover;
            border-radius: 8px;
            margin-top: 2rem;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-overlay {
            background: rgba(0,0,0,0.6);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }
        @media (max-width: 768px) {
            .contact-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-gamepad"></i> <span>DYSCOVER</span> NEXUS
            </a>
            <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav-links">
                <a href="../index.html">Home</a>
                <a href="about.html">About Game</a>
                <a href="product.html">Store</a>
                <a href="contact.html" style="color: var(--primary);">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="glass-panel contact-container">
            <div class="contact-info">
                <div>
                    <h2 class="gradient-text" style="margin-bottom: 2rem;">Get In Touch</h2>
                    
                    <div class="info-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <div>
                            <h4>Location</h4>
                            <p style="color: var(--text-muted);">Level 28, Menara Maxis, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia</p>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <i class="fa-solid fa-envelope"></i>
                        <div>
                            <h4>Email</h4>
                            <p style="color: var(--text-muted);">support@dyscovernexus.com</p>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <i class="fa-solid fa-phone"></i>
                        <div>
                            <h4>Phone</h4>
                            <p style="color: var(--text-muted);">+60 3-2615 8000</p>
                        </div>
                    </div>
                </div>
                
                <div>
                    <h4 style="margin-bottom: 1rem;">Find Us</h4>
                    <div class="map-placeholder">
                        <div class="map-overlay">Interactive Map Disabled in Demo</div>
                    </div>
                </div>
            </div>

            <div class="contact-form-wrapper">
                <h3 style="margin-bottom: 2rem;">Send a Message</h3>
                <form id="contactForm" novalidate>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" class="form-control" rows="5" placeholder="How can we help you?"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/validation.js"></script>
</body>
</html>
