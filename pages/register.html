<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DysCover Nexus</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            position: relative;
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: var(--neon-gradient);
            z-index: -1;
            border-radius: 18px;
            opacity: 0.5;
        }
        #passwordStrength {
            font-size: 0.8rem;
            margin-top: 0.3rem;
            font-weight: bold;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-gamepad"></i> <span>DYSCOVER</span>
            </a>
            <nav class="nav-links">
                <a href="../index.html">Back to Home</a>
            </nav>
        </div>
    </header>

    <main class="auth-container">
        <div class="glass-panel auth-card">
            <div class="text-center" style="margin-bottom: 2rem;">
                <h2 class="gradient-text">Create Account</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Join the Nexus and transform your learning journey.</p>
            </div>
            
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="PlayerOne">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="player@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••">
                    <span id="passwordStrength" style="color: var(--primary);"></span>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••">
                </div>
                
                <div style="margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
                    <label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" required style="margin-top: 0.2rem;"> 
                        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-user-plus"></i> Register</button>
            </form>
            
            <p class="text-center" style="margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </div>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/validation.js"></script>
</body>
</html>
